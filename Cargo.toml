[package]
name = "langelot"
version = "0.1.0"
edition = "2024"
description = "Langelot (lgt) — an observability-minded tee replacement with a live TUI"

[[bin]]
name = "lgt"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "6.0.0"
jiff = "0.2.35"
libc = "0.2.189"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
